<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title | default("Sample Blog") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(180deg, #f8fafc 0%, #edf2ff 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .navbar {
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sample Blog</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-3">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/submit">Submit Review</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        <div class="row mb-4">
            <div class="col-lg-8">
                <h1 class="display-5 fw-bold mb-3">Welcome to the Sample Blog</h1>
                <p class="lead text-secondary">A simple FastAPI blog with clean post pages and review submissions.</p>
            </div>
        </div>

        <div class="row g-4">
            {% for post in posts %}
            <div class="col-md-6 col-xl-4">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <p class="text-uppercase text-primary fw-semibold mb-2">Post #{{ post.id }}</p>
                        <h2 class="h4 mb-3">{{ post.title }}</h2>
                        <p class="card-text text-secondary flex-grow-1">{{ post.content }}</p>
                        <a href="/posts/{{ post.id }}" class="btn btn-primary mt-3">Read more</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endblock %}
    </main>
</body>
</html>
