{% extends "index.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card mb-4">
            <div class="card-body p-4 p-lg-5">
                <p class="text-uppercase text-primary fw-semibold mb-2">Post #{{ post.id }}</p>
                <h1 class="display-6 mb-3">{{ post.title }}</h1>
                <p class="lead text-secondary">{{ post.content }}</p>

                <div class="d-flex flex-wrap gap-2 mt-4">
                    <a href="/" class="btn btn-outline-secondary">Back to home</a>
                    {% if next_post_id %}
                    <a href="/posts/{{ next_post_id }}" class="btn btn-primary">Next post</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Leave a review</h2>
                <form action="/submit" method="post">
                    <div class="mb-3">
                        <label for="postId" class="form-label">Post ID</label>
                        <input type="number" class="form-control" id="postId" name="post_id" value="{{ post.id }}" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-success">Submit review</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
